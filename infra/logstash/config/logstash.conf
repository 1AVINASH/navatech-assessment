input {
  jdbc {
    jdbc_driver_library => "/usr/share/logstash/jdbc_driver/postgresql-42.7.7.jar" # Path to your JDBC driver
    jdbc_driver_class => "org.postgresql.Driver"
    jdbc_connection_string => "jdbc:postgresql://db:5432/postgres_db" # Use service name 'db'
    jdbc_user => "admin"
    jdbc_password => "secret"
    schedule => "*/5 * * * * *" # Run every 5 seconds (adjust as needed)

    # SQL query for initial full import
    statement => "SELECT id, name FROM organization"
    # To handle updates/deletes and initial sync, you often need a timestamp column
    # or use a more advanced approach like Debezium.
    # For incremental updates, you'd use something like:
    # use_column_value => true
    # tracking_column => "updated_at" # A timestamp column in your products table
    # tracking_column_type => "timestamp"
    # clean_run => true # Set to true for first run to get all data, then false for incremental
    # statement => "SELECT id, name, description, price FROM products WHERE updated_at > :sql_last_value ORDER BY updated_at ASC"

    clean_run => true # For initial setup, always fetch all data
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"] # Use service name 'elasticsearch'
    index => "organizations" # The Elasticsearch index name
    document_id => "%{id}" # Use the 'id' field from PostgreSQL as the document ID in ES
    user => "elasticuser" # Default username for basic security (even if xpack.security is false)
    password => "testpassword" # Same password as ES service
  }
  stdout { codec => rubydebug } # Optional: Log processed events to Logstash stdout for debugging
}