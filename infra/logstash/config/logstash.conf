input {
  jdbc {
    jdbc_driver_library => "/usr/share/logstash/jdbc_driver/postgresql-42.7.7.jar" # Path to your JDBC driver
    jdbc_driver_class => "org.postgresql.Driver"
    jdbc_connection_string => "jdbc:postgresql://db:5432/postgres_db" # Use service name 'db'
    jdbc_user => "admin"
    jdbc_password => "secret"

    # Unique type for events from this input
    type => "organization" 
    
    # --- Incremental Sync Configuration ---
    use_column_value => true                  # Enable column value tracking
    tracking_column => "created_at"      # The column to track for changes (MUST be SQL type TIMESTAMP, DATETIME, or similar)
    tracking_column_type => "timestamp"       # Specify the type (important for date comparisons)
    last_run_metadata_path => "/usr/share/logstash/data/logstash_jdbc_organization_last_run.txt" # Path to store the last value

    # Schedule for incremental runs (e.g., every 5 minutes)
    schedule => "*/5 * * * *"                 # cron syntax: minute hour day_of_month month day_of_week

    # SQL statement for incremental sync
    # It uses a placeholder :sql_last_value which Logstash manages
    # Make sure to select the tracking_column in your statement!
    statement => "SELECT id, name, created_at FROM organization WHERE created_at > :sql_last_value ORDER BY created_at ASC"

    # --- Initial Full Sync (Optional, but often needed first time) ---
    # For the *very first run*, Logstash sets :sql_last_value to Unix epoch (1970-01-01 00:00:00 UTC).
    # This means the initial run will fetch ALL records where last_updated_at is after that.
    # If your table has very old data and you want to truly start from scratch or a specific point,
    # you might need to manually prime last_run_metadata_path or adjust the statement.

    clean_run => true # For initial setup, always fetch all data
  }

  jdbc {
    jdbc_driver_library => "/usr/share/logstash/jdbc_driver/postgresql-42.7.7.jar" # Path to your JDBC driver
    jdbc_driver_class => "org.postgresql.Driver"
    jdbc_connection_string => "jdbc:postgresql://db:5432/postgres_db" # Use service name 'db'
    jdbc_user => "admin"
    jdbc_password => "secret"

    # Unique type for events from this input
    type => "admin" 
    
    # --- Incremental Sync Configuration ---
    use_column_value => true                  # Enable column value tracking
    tracking_column => "created_at"      # The column to track for changes (MUST be SQL type TIMESTAMP, DATETIME, or similar)
    tracking_column_type => "timestamp"       # Specify the type (important for date comparisons)
    last_run_metadata_path => "/usr/share/logstash/data/logstash_jdbc_admin_last_run.txt" # Path to store the last value

    # Schedule for incremental runs (e.g., every 5 minutes)
    schedule => "*/5 * * * *"

    # SQL statement for incremental sync
    # It uses a placeholder :sql_last_value which Logstash manages
    # Make sure to select the tracking_column in your statement!
    statement => "SELECT id, email, created_at FROM admin WHERE created_at > :sql_last_value ORDER BY created_at ASC"
    clean_run => true # For initial setup, always fetch all data
  }
}

output {
  if [type] == "organization" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"] # Use service name 'elasticsearch'
      index => "organizations" # The Elasticsearch index name
      document_id => "%{id}" # Use the 'id' field from PostgreSQL as the document ID in ES
      user => "elasticuser" # Default username for basic security (even if xpack.security is false)
      password => "testpassword" # Same password as ES service
      manage_template => true
      template_name => "logstash_organizations_template"
      template => '{ "index_patterns": ["organizations"], "settings": { "number_of_shards": 1, "number_of_replicas": 0 } }'
    }
  }
  if [type] == "admin" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"] # Use service name 'elasticsearch'
      index => "admins" # The Elasticsearch index name
      document_id => "%{id}" # Use the 'id' field from PostgreSQL as the document ID in ES
      user => "elasticuser" # Default username for basic security (even if xpack.security is false)
      password => "testpassword" # Same password as ES service
      manage_template => true
      template_name => "logstash_admins_template"
      template => '{ "index_patterns": ["admins"], "settings": { "number_of_shards": 1, "number_of_replicas": 0 } }'
    }
  }
  stdout { codec => rubydebug } # Optional: Log processed events to Logstash stdout for debugging
}